# Temporary ops workflow: archive 0.1.1 under dist-tag v0, deprecate 1.0.0.
# Delete this file/branch after a successful run. Uses NPM_TOKEN (not OIDC).
name: ops-archive-deprecate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-and-deprecate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.1.1 package tree
        uses: actions/checkout@v7
        with:
          ref: v0.1.1

      - name: Setup Node + install
        uses: ./.github/actions/setup

      - name: Build
        run: npm run tsc:build

      - name: Publish 0.1.1 with dist-tag v0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "${HOME}/.npmrc"
          echo "registry=https://registry.npmjs.org/" >> "${HOME}/.npmrc"
          npm whoami
          # Skip if already published
          if npm view "@itsaorg/ts-blueprint@0.1.1" version >/dev/null 2>&1; then
            echo "0.1.1 already on registry — ensuring dist-tag v0"
            npm dist-tag add @itsaorg/ts-blueprint@0.1.1 v0
          else
            npm publish --access public --tag v0
          fi
          npm view @itsaorg/ts-blueprint dist-tags --json

      - name: Deprecate 1.0.0
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "${HOME}/.npmrc"
          npm deprecate @itsaorg/ts-blueprint@1.0.0 "Superseded by the Git Flow line. Install @itsaorg/ts-blueprint@>=1.0.1."
          npm view @itsaorg/ts-blueprint@1.0.0 deprecated || true
