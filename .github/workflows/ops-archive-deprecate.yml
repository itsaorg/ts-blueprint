# Temporary ops workflow: publish 1.0.1, archive 0.1.1 under v0, deprecate 1.0.0.
# Delete after a successful run. Uses NPM_TOKEN (OIDC Trusted Publishing returned 404).
name: ops-archive-deprecate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Publish 1.0.1 as latest
        uses: actions/checkout@v7
        with:
          ref: v1.0.1

      - name: Setup for 1.0.1
        uses: ./.github/actions/setup

      - name: Build 1.0.1
        run: npm run tsc:build

      - name: npm publish 1.0.1 latest
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "${HOME}/.npmrc"
          npm whoami
          if npm view "@itsaorg/ts-blueprint@1.0.1" version >/dev/null 2>&1; then
            echo "1.0.1 already on registry — ensuring latest dist-tag"
            npm dist-tag add @itsaorg/ts-blueprint@1.0.1 latest
          else
            npm publish --access public --tag latest
          fi

      - name: Checkout v0.1.1 for archive
        uses: actions/checkout@v7
        with:
          ref: v0.1.1

      - name: Setup for 0.1.1
        uses: ./.github/actions/setup

      - name: Build 0.1.1
        run: npm run tsc:build

      - name: Publish 0.1.1 with dist-tag v0
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "${HOME}/.npmrc"
          if npm view "@itsaorg/ts-blueprint@0.1.1" version >/dev/null 2>&1; then
            echo "0.1.1 already on registry — ensuring dist-tag v0"
            npm dist-tag add @itsaorg/ts-blueprint@0.1.1 v0
          else
            npm publish --access public --tag v0
          fi
          npm view @itsaorg/ts-blueprint dist-tags --json
          npm view @itsaorg/ts-blueprint versions --json

      - name: Deprecate 1.0.0
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "${HOME}/.npmrc"
          npm deprecate @itsaorg/ts-blueprint@1.0.0 "Superseded by the Git Flow line. Install @itsaorg/ts-blueprint@>=1.0.1."
          npm view @itsaorg/ts-blueprint@1.0.0 deprecated || true
