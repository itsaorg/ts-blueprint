# Temporary ops: archive 0.1.1 under line-v0, deprecate 1.0.0.
# (npm rejects dist-tag "v0" as a SemVer range.)
name: ops-archive-deprecate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v0.1.1

      - uses: ./.github/actions/setup

      - run: npm run tsc:build

      - name: Publish 0.1.1 with dist-tag line-v0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          CFG="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          printf '%s\n' "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" "registry=https://registry.npmjs.org/" > "$CFG"
          export NPM_CONFIG_USERCONFIG="$CFG"
          npm whoami
          if npm view "@itsaorg/ts-blueprint@0.1.1" version >/dev/null 2>&1; then
            npm dist-tag add @itsaorg/ts-blueprint@0.1.1 line-v0
          else
            npm publish --access public --tag line-v0
          fi
          npm view @itsaorg/ts-blueprint dist-tags --json
          npm view @itsaorg/ts-blueprint versions --json

      - name: Deprecate 1.0.0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          CFG="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          printf '%s\n' "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" "registry=https://registry.npmjs.org/" > "$CFG"
          export NPM_CONFIG_USERCONFIG="$CFG"
          npm deprecate @itsaorg/ts-blueprint@1.0.0 "Superseded by the Git Flow line. Install @itsaorg/ts-blueprint@>=1.0.1."
          npm view @itsaorg/ts-blueprint@1.0.0 deprecated || true
