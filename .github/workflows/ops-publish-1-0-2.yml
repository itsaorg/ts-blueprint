name: ops-publish-1-0-2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v1.0.2
      - uses: ./.github/actions/setup
      - run: npm run tsc:build
      - name: Publish 1.0.2 as latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          CFG="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          printf '%s\n' "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" "registry=https://registry.npmjs.org/" > "$CFG"
          export NPM_CONFIG_USERCONFIG="$CFG"
          npm whoami
          if npm view "@itsaorg/ts-blueprint@1.0.2" version >/dev/null 2>&1; then
            npm dist-tag add @itsaorg/ts-blueprint@1.0.2 latest
          else
            npm publish --access public --tag latest
          fi
          npm view @itsaorg/ts-blueprint dist-tags --json
          npm view @itsaorg/ts-blueprint versions --json
